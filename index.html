<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>PaperNest – Premium Stationery & Personalized Gifts Store</title>
    <meta
      name="description"
      content="PaperNest is your one-stop shop for premium stationery, personalized gifts, custom mugs, stickers, photo prints and more. Order on WhatsApp for fast delivery."
    />
    <meta
      name="keywords"
      content="stationery, personalized gifts, custom mugs, stickers, photo prints, notebooks, gift boxes, WhatsApp order"
    />
    <meta name="author" content="PaperNest" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://papernest.in/" />
    <meta property="og:title" content="PaperNest – Premium Stationery & Personalized Gifts" />
    <meta
      property="og:description"
      content="Explore our curated range of premium stationery, personalized gifts, custom mugs, stickers, and photo prints. Order on WhatsApp!"
    />
    <meta property="og:image" content="https://papernest.in/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaperNest – Premium Stationery & Personalized Gifts" />
    <meta
      name="twitter:description"
      content="Your one-stop shop for premium stationery and personalized gifts. Order on WhatsApp!"
    />
    <meta name="twitter:image" content="https://papernest.in/og-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ff4f7a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
